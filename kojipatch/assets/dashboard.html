<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koji patch dashboard</title>
<style>
:root {
  --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --line: #e5e7eb;
  --card: #f9fafb; --accent: #2563eb; --up: #15803d; --down: #b91c1c;
  --major: #b45309; --added: #15803d; --removed: #b91c1c; --repack: #7c3aed;
  --hit: #fde68a; --hitfg: #1a1a1a;
  /* Цвета классов патчей. Они же красят «полоску состава» в колонке
     патчей, теги строк и полосы групп в развёрнутой строке: один и тот же
     класс всюду одного цвета, иначе полоска ничего не сообщает. */
  --autogen: #4338ca; --cve: #be123c; --sast: #6d28d9; --dast: #0e7490;
  --coverage: #4d7c0f; --spec: #a16207; --changelog: #a21caf;
  --files: #0f766e; --other: #6b7280;
  /* высоту панели фильтров проставляет JS — от неё зависит смещение
     «липкой» шапки таблицы. Значение здесь — запасное, до первого замера. */
  --controls-h: 3.4rem;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --fg: #e6e6e6; --muted: #9ca3af; --line: #262a33;
    --card: #171a21; --accent: #60a5fa; --up: #4ade80; --down: #f87171;
    --major: #fbbf24; --added: #4ade80; --removed: #f87171; --repack: #c4b5fd;
    --hit: #78350f; --hitfg: #fef3c7;
    --autogen: #818cf8; --cve: #fb7185; --sast: #a78bfa; --dast: #22d3ee;
    --coverage: #a3e635; --spec: #fbbf24; --changelog: #e879f9;
    --files: #5eead4; --other: #9ca3af;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 2rem 1.25rem 4rem; background: var(--bg); color: var(--fg);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.wrap { max-width: 1400px; margin: 0 auto; }
h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
.meta { color: var(--muted); font-size: .875rem; margin-bottom: 1.25rem; }
.meta div { overflow-wrap: anywhere; }
.meta b { color: var(--fg); font-weight: 600; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

/* Панель источников: что сейчас загружено и в каком порядке сравнивается.
   Цепочка видна всегда, список с кнопками — по требованию: переставляют и
   убирают снапшоты редко, а знать, что лежит на странице, нужно всегда. */
.sources { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem;
  margin-bottom: .8rem; }
.chain { font-size: .875rem; margin-right: auto; overflow-wrap: anywhere; }
.chain .l { color: var(--muted); font-size: .7rem; text-transform: uppercase;
  letter-spacing: .03em; }
.chain .arrow { color: var(--muted); }
.sourcelist { list-style: none; margin: 0 0 1rem; padding: 0; }
.sourcelist li { display: flex; flex-wrap: wrap; align-items: baseline;
  gap: .1rem .5rem; padding: .35rem .6rem; margin-bottom: .3rem;
  border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.sourcelist .sub { color: var(--muted); font-size: .78rem; margin-right: auto;
  overflow-wrap: anywhere; }
.mini { padding: .1rem .5rem; font-size: .8rem; line-height: 1.3; }
.mini[disabled] { opacity: .4; cursor: default; }
.warn { color: var(--major); font-size: .82rem; margin-bottom: .35rem;
  padding-left: .55rem; border-left: 3px solid var(--major); }
.loaderrors:not(:empty) { margin: 0 0 1rem; }

/* Экран загрузки. Пунктирная рамка говорит «сюда можно ронять» без единого
   слова инструкции; подсветка появляется, пока файл над страницей. */
.drop { border: 2px dashed var(--line); border-radius: 10px;
  padding: 3rem 1.5rem; text-align: center; }
.drop.over { border-color: var(--accent); }
.dropmain { font-size: 1.1rem; font-weight: 600; margin: 0 0 .4rem; }
.dropsub { color: var(--muted); font-size: .875rem; margin: 0; }
/* Кнопка внутри фразы: выглядит ссылкой, потому что стоит в тексте, но
   остаётся кнопкой — она открывает диалог, а никуда не ведёт. */
.linkish { display: inline; padding: 0; border: 0; border-radius: 0;
  background: none; color: var(--accent); font: inherit;
  text-decoration: underline; cursor: pointer; }
.linkish:hover { border: 0; }

/* Вкладки: не «кнопки приложения», а закладки документа — активная
   подчёркнута той же линией, что и шапка таблицы под ней. */
.tabs { display: flex; gap: .25rem; border-bottom: 1px solid var(--line);
  margin-bottom: 1rem; }
/* display у .tabs и .sources сильнее hidden из стилей браузера: без этих
   двух строк спрятанные скриптом панели остались бы на экране. */
.tabs[hidden], .sources[hidden] { display: none; }
.tab { appearance: none; background: none; border: 0; border-radius: 0;
  padding: .5rem .9rem; margin-bottom: -1px; color: var(--muted);
  font: inherit; font-size: .95rem; font-weight: 600; cursor: pointer;
  border-bottom: 2px solid transparent; }
.tab:hover { color: var(--fg); }
.tab[aria-selected=true] { color: var(--fg); border-bottom-color: var(--accent); }
.tab[hidden] { display: none; }

/* Селектор тега или пары тегов. Всегда виден, даже когда выбор один:
   он подписывает, на что именно смотрит страница. */
.selector { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .9rem; }
.pick { display: flex; align-items: baseline; gap: .45rem; padding: .35rem .75rem;
  border-radius: 999px; border: 1px solid var(--line); background: var(--card);
  color: var(--fg); font: inherit; font-size: .85rem; cursor: pointer; }
.pick:hover { border-color: var(--accent); }
.pick .sub { color: var(--muted); font-size: .75rem; }
.pick[aria-pressed=true] { border-color: var(--accent); color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent); }
.pick[aria-pressed=true] .sub { color: var(--accent); }
.pick .sum { font-size: .68rem; text-transform: uppercase; letter-spacing: .05em;
  color: var(--major); }

.cards { display: grid; gap: .6rem; }
/* Итоги тега — крупно; разрезы по классам и статусам — плотной сеткой. */
.cards.global { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  margin-bottom: .6rem; }
.cards.diff { grid-template-columns: repeat(auto-fit, minmax(122px, 1fr));
  margin-bottom: 1.5rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: .55rem .65rem; }
.card .n { font-size: 1.2rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.card .unit { font-size: .72rem; font-weight: 500; color: var(--muted);
  letter-spacing: .02em; }
.card .rpm { font-size: .74rem; font-weight: 500; color: var(--muted);
  font-variant-numeric: tabular-nums; margin-bottom: .15rem; min-height: 1em; }
.card .l { font-size: .7rem; color: var(--muted); text-transform: uppercase;
  letter-spacing: .03em; }
.card.big { padding: .85rem 1rem; }
.card.big .l { font-size: .74rem; font-weight: 700; color: var(--fg);
  margin-bottom: .35rem; }
.card.big .n { font-size: 2rem; line-height: 1.1; }
.card.big .rpm { margin: .3rem 0 0; }
.card.clickable { cursor: pointer; text-align: left; font: inherit;
  color: var(--fg); width: 100%; }
.card.clickable:hover { border-color: var(--accent); }
.card.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card[aria-pressed=true] { border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent); }
.card[aria-pressed=true] .n { color: var(--accent); }
/* Класс патчей — цветной, поэтому карточка класса красит только подпись:
   номер остаётся нейтральным и колонки чисел читаются как одна сетка. */
.card .l.c-autogen, .tag.c-autogen, .pgroup.c-autogen,
.meter i.c-autogen { color: var(--autogen); }
.card .l.c-cve, .tag.c-cve, .pgroup.c-cve, .meter i.c-cve { color: var(--cve); }
.card .l.c-sast, .tag.c-sast, .pgroup.c-sast, .meter i.c-sast { color: var(--sast); }
.card .l.c-dast, .tag.c-dast, .pgroup.c-dast, .meter i.c-dast { color: var(--dast); }
.card .l.c-coverage, .tag.c-coverage, .pgroup.c-coverage,
.meter i.c-coverage { color: var(--coverage); }
.card .l.c-spec, .tag.c-spec, .pgroup.c-spec, .meter i.c-spec { color: var(--spec); }
.card .l.c-changelog, .tag.c-changelog, .pgroup.c-changelog,
.meter i.c-changelog { color: var(--changelog); }
.card .l.c-files, .tag.c-files, .pgroup.c-files,
.meter i.c-files { color: var(--files); }
.card .l.c-other, .tag.c-other, .pgroup.c-other, .meter i.c-other { color: var(--other); }
.card .l.c-x, .tag.c-x, .pgroup.c-x, .meter i.c-x { color: var(--accent); }

.controls { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
  position: sticky; top: 0; background: var(--bg); padding: .6rem 0; z-index: 20;
  border-bottom: 1px solid var(--line); }
input[type=search] {
  flex: 1 1 auto; min-width: 200px; padding: .5rem .75rem; border-radius: 6px;
  border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit;
}
input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px;
  border-color: var(--accent); }
button {
  padding: .4rem .7rem; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); color: var(--fg); font: inherit; font-size: .85rem;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toggle { flex: 0 0 auto; white-space: nowrap; }
.toggle[disabled] { opacity: .5; cursor: default; }
.count { color: var(--muted); font-size: .85rem; margin-left: auto;
  font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Чипы активных фильтров: карточки уезжают при прокрутке, а фильтры
   складываются по И — без этой строки непонятно, почему таблица пуста. */
.chips { display: flex; flex-wrap: wrap; gap: .35rem; padding: .5rem 0 0; }
.chips:empty { padding: 0; }
.chip { display: inline-flex; align-items: center; gap: .35rem; padding: .18rem .5rem;
  border-radius: 999px; border: 1px solid var(--accent); background: var(--card);
  color: var(--accent); font-size: .78rem; cursor: pointer; }
.chip:hover { background: var(--accent); color: #fff; }
.chip.clear { border-color: var(--line); color: var(--muted); }
.chip.clear:hover { background: var(--line); color: var(--fg); }

/* Никакого overflow на обёртке: он сделал бы её скролл-контейнером,
   и sticky-шапка стала бы отсчитываться от неё, а не от окна. */
.tablewrap { border-top: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: .45rem .7rem; border-bottom: 1px solid var(--line);
  vertical-align: top; }
thead th {
  position: sticky; top: var(--controls-h); background: var(--card); z-index: 10;
  user-select: none; white-space: nowrap;
  /* border-bottom у sticky-ячейки при border-collapse не рисуется */
  box-shadow: inset 0 -1px 0 var(--line);
}
thead th[data-sort] { cursor: pointer; }
thead th[data-sort]:hover { color: var(--accent); }
thead th .arrow { color: var(--muted); font-size: .75rem; }
tr.main-row { cursor: pointer; }
tr.main-row:hover > td { background: var(--card); }
/* Проблемные сборки помечены полосой у левого края: это ответ на вопрос
   «где смотреть» ещё до того, как строка развёрнута. */
tr.main-row.bad > td:first-child { box-shadow: inset 3px 0 0 var(--removed); }
/* break-word, а не anywhere: последний рвёт версию посередине, и 'el10'
   превращается в 'el1 0'. */
td.src { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600;
  overflow-wrap: break-word; }
td.ver { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
  overflow-wrap: break-word; }
td.ver.new { color: var(--fg); }
td.branch, td.tagged { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: .85em; overflow-wrap: break-word; }
/* Имя koji-тега не переносим: разорванное посередине, оно перестаёт быть
   именем, а искать его глазами приходится в каждой унаследованной строке.
   Колонка при auto-раскладке возьмёт ширину самого длинного тега — а он
   стоит не в каждой строке, у затегованных прямо здесь прочерк. */
td.tagged { white-space: nowrap; overflow-wrap: normal; }
td.dir { text-align: center; font-weight: 700; white-space: nowrap; }
tr.upgraded td.dir { color: var(--up); }
tr.downgraded td.dir { color: var(--down); }
tr.added td.dir { color: var(--added); }
tr.removed td.dir { color: var(--removed); }
td.num, td.built { text-align: right; font-variant-numeric: tabular-nums;
  color: var(--muted); white-space: nowrap; }
td.built { font-size: .82rem; }
/* Время рядом с датой: та же строка, но бледнее, чтобы колонка читалась
   по датам, а точное время не мешало их сравнивать. */
td.built .tm { opacity: .65; }
td.pat { white-space: nowrap; font-variant-numeric: tabular-nums; }
td.pat .zero { color: var(--muted); }
td.links { text-align: right; white-space: nowrap; }
td.tags { white-space: nowrap; }
.plus { color: var(--added); }
.minus { color: var(--removed); }
/* На узком экране девять колонок не помещаются. Пусть скроллится таблица,
   а не вся страница вместе с панелью поиска; sticky-шапкой жертвуем. */
@media (max-width: 900px) {
  .tablewrap { overflow-x: auto; }
  thead th { position: static; }
  /* td.tagged здесь не трогаем: таблица уже скроллится, и целое имя тега
     полезнее сэкономленных пикселей. */
  td.src, td.ver, td.branch { overflow-wrap: anywhere; }
  td.tags { white-space: normal; }
}
a.link { display: inline-block; padding: .12rem .5rem; border-radius: 999px;
  border: 1px solid var(--line); color: var(--accent); text-decoration: none;
  font-size: .72rem; font-weight: 500; margin-left: .2rem; }
a.link:hover { border-color: var(--accent); background: var(--bg); }
.chev { display: inline-block; width: 1em; color: var(--muted); font-size: .8em; }
.tag { display: inline-block; font-size: .72rem; padding: .1rem .45rem; border-radius: 999px;
  border: 1px solid currentColor; white-space: nowrap; margin-right: .2rem; }
/* Теги в строках — те же фильтры, что и карточки: клик включает. */
.tag[data-filter] { cursor: pointer; }
.tag[data-filter]:hover { box-shadow: 0 0 0 1px currentColor; }
.tag.added { color: var(--added); }
.tag.removed { color: var(--removed); }
.tag.upgraded { color: var(--up); }
.tag.downgraded { color: var(--down); }
.tag.unchanged { color: var(--muted); }
.tag.repackaged { color: var(--repack); }
.tag.bad { color: var(--removed); }
.tag.warn { color: var(--major); }
.tag.calm { color: var(--muted); }

/* Полоска состава патчей: доли классов в одной сборке. В колонке из сотен
   строк по ней видно, где стек патчей — это CVE, а где — «прочее».
   Ширина одна для всех строк: доли сравнимы между сборками только тогда,
   когда полоски одной длины. Радиус скругления небольшой — при пилюле
   крайние сегменты срезались бы, и доля читалась бы меньше настоящей. */
.meter { display: inline-flex; width: 120px; height: 10px; border-radius: 3px;
  overflow: hidden; margin-left: .55rem; vertical-align: middle;
  background: var(--line); }
/* Класс, представленный одним патчем из сотни, даёт долю тоньше пикселя.
   Пол в 2px оставляет его видимым: «класс есть, но его не видно» — худшая
   из ошибок этой полоски, а точные числа всё равно в подсказке. */
.meter i { display: block; height: 100%; background: currentColor;
  min-width: 2px; }

.hit { background: var(--hit); color: var(--hitfg); border-radius: 2px; }

/* Развёрнутая строка. Один и тот же скелет для обеих вкладок:
   подписанные блоки, внутри — пары «ключ — значение» и списки. */
tr.detail-row > td { background: var(--card); padding: .85rem .7rem 1.1rem 2.2rem; }
/* Ровно две колонки, как у «было/стало»: koji и gitlab, под ними патчи и
   RPM, проблемы во всю ширину. Прежний auto-fit ужимал блоки тем сильнее,
   чем шире экран — на широком все пять вставали в одну строку, и списку
   пакетов доставалась колонка, в которую NVRA не влезает. */
.detail { display: grid; gap: 1rem 1.6rem;
  grid-template-columns: 1fr 1fr; align-items: start; }
@media (max-width: 760px) { .detail { grid-template-columns: 1fr; } }
.block { min-width: 0; }
.block.wide { grid-column: 1 / -1; }
.bl { font-size: .68rem; text-transform: uppercase; letter-spacing: .07em;
  color: var(--muted); font-weight: 700; padding-bottom: .3rem; margin-bottom: .45rem;
  border-bottom: 1px solid var(--line); }
.kv { display: flex; gap: .5rem; font-size: .82rem; padding: .08rem 0; }
.kv .k { color: var(--muted); flex: 0 0 6.2rem; }
.kv .v { min-width: 0; overflow-wrap: anywhere; }
.pgroup { margin-bottom: .5rem; }
.pgroup .pclass { font-size: .7rem; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; }
.pgroup .pclass .n { color: var(--muted); font-weight: 600; }
/* Блок архитектуры набран так же, как блок класса патчей, но без цвета:
   цвет в этом дашборде означает класс патча, и раскрасить им ещё и
   архитектуры значило бы завести вторую, ложную легенду. */
.pgroup.arch .pclass { color: var(--fg); }
.plist { list-style: none; margin: .2rem 0 0; padding: .1rem 0 .1rem .6rem;
  border-left: 2px solid currentColor; }
.plist li { color: var(--fg); font-size: .82rem; padding: .1rem 0;
  overflow-wrap: anywhere; }
.plist li.is-added { color: var(--added); }
.plist li.is-removed { color: var(--removed); }
.plist a { color: var(--accent); text-decoration: none;
  border-bottom: 1px solid transparent; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.plist a:hover { border-bottom-color: var(--accent); }
/* Пришедший и ушедший патч должны читаться и по ссылке тоже: иначе синий
   цвет ссылки съедает единственный сигнал «что изменилось». */
.plist li.is-added a { color: var(--added); }
.plist li.is-removed a { color: var(--removed); text-decoration: line-through; }
.plist .ppath { color: var(--muted); font-size: .74rem; }
/* Знак дублирует цвет — на случай, если цвет не различим. */
.sign { font-weight: 700; margin-right: .15rem; }
/* Пакеты — такой же список, как патчи, по одному в строке. */
.rlist { list-style: none; margin: .2rem 0 0; padding: .1rem 0 .1rem .6rem;
  border-left: 2px solid var(--line); }
/* Висячий отступ: перенесённый хвост NVRA сдвинут вправо и не читается как
   ещё один пакет. Первая строка при этом стоит там же, где стояла. */
.rlist li { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: .78rem; padding: .1rem 0 .1rem .9rem; text-indent: -.9rem;
  overflow-wrap: anywhere; }
/* Только во вкладке «изменения»: там левая и правая колонки выравниваются
   по номеру строки, и перенос длинного NVRA сдвинул бы всё, что ниже.
   Поэтому строка ровно одна, а списку даётся горизонтальная прокрутка —
   полоса появляется под всеми строками и высоту строк не трогает. */
.rlist.fixed { overflow-x: auto; }
.rlist.fixed li { white-space: nowrap; overflow-wrap: normal;
  padding-left: 0; text-indent: 0; }
.rlist li.is-added { color: var(--added); }
.rlist li.is-removed { color: var(--removed); text-decoration: line-through; }
/* Пустая ячейка напротив пришедшего или ушедшего пакета: строка обязана
   занять место, иначе соседняя колонка уедет вверх. */
.rlist li.rgap { color: var(--muted); opacity: .45; }
/* Ветка, сменившаяся между тегами, красится тем же цветом, что и уехавший
   или приехавший патч: «эта сторона потеряла» / «эта сторона получила». */
.is-added { color: var(--added); }
.is-removed { color: var(--removed); }
.problems { list-style: none; margin: 0; padding: 0; }
.problems li { color: var(--removed); font-size: .82rem; padding: .1rem 0;
  overflow-wrap: anywhere; }
.none { color: var(--muted); font-size: .82rem; }
/* Приписка к значению: «прямой», «унаследован». */
.note { color: var(--muted); font-size: .74rem; margin-left: .4rem; }
/* Список koji-тегов билда. Основной набран цветом текста и жирным, прочие
   приглушены: глаз должен находить «где билд сейчас» без чтения списка. */
.ktags { display: flex; flex-wrap: wrap; gap: .05rem .55rem;
  align-items: baseline; }
.ktag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; }
.ktag.main { color: var(--fg); font-weight: 700; }
/* «Было / стало» — две колонки одинаковой ширины, чтобы взгляд сравнивал
   строки по горизонтали, а не искал соответствие. */
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 1.6rem; }
@media (max-width: 760px) { .sides { grid-template-columns: 1fr; } }
.side { min-width: 0; }
.side .bl b { color: var(--fg); }

.empty { padding: 2rem; text-align: center; color: var(--muted); }
/* Подсказка живёт одна на всю страницу и позиционируется скриптом,
   иначе у крайних карточек она вылезала бы за край окна. */
#tip { position: fixed; display: none; z-index: 100; max-width: 320px;
  background: var(--fg); color: var(--bg); font-size: .78rem; line-height: 1.45;
  padding: .5rem .65rem; border-radius: 6px; pointer-events: none;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .28); }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Koji patch dashboard</h1>
  <div class="meta" id="meta"></div>
  <div class="sources" id="sources" hidden>
    <div class="chain" id="chain"></div>
    <button type="button" class="toggle" id="add-more">добавить</button>
    <button type="button" class="toggle" id="edit-sources" aria-expanded="false">изменить</button>
  </div>
  <ul class="sourcelist" id="sourcelist" hidden></ul>
  <div class="warnings" id="warnings"></div>
  <!-- Список ошибок загрузки стоит снаружи «пустого» экрана: как только
       появились данные, экран прячется, и отказ файла внутри него никто
       бы не увидел. -->
  <ul class="problems loaderrors" id="load-errors"></ul>
  <section id="tab-empty">
    <div class="drop" id="drop">
      <p class="dropmain">Перетащите снапшоты сюда</p>
      <p class="dropsub">или <button type="button" class="linkish" id="pick">выберите файлы</button>.
        Это JSON, который делает <span class="mono">kojipatch collect</span>.</p>
    </div>
  </section>
  <input type="file" id="file-input" accept=".json,application/json" multiple hidden>
  <nav class="tabs">
    <button class="tab" data-tab="state" aria-selected="true">Состояние</button>
    <button class="tab" data-tab="diff" data-tip="Что изменилось между двумя тегами: компоненты, версии, патчи, состав RPM, ветки.">Изменения</button>
  </nav>
  <section id="tab-state">
    <div class="selector" id="tag-select"></div>
    <div class="cards global" id="state-cards"></div>
    <div class="cards diff" id="class-cards"></div>
    <div class="controls" id="controls">
      <input type="search" id="q" placeholder="Компонент, тег, ветка, патч, CVE, RPM…" autocomplete="off">
      <button id="expand" class="toggle" data-tip="Развернуть или свернуть все строки, которые сейчас видны. Фильтры и поиск учитываются.">Expand all</button>
      <button id="copy-nvr" class="toggle" data-tip="Скопировать NVR отфильтрованных строк">Copy NVR</button>
      <span class="count" id="count"></span>
    </div>
    <div class="chips" id="chips"></div>
    <div class="tablewrap"><table id="state-table">
      <thead><tr>
        <th data-sort="name">компонент <span class="arrow">▲</span></th>
        <th data-sort="evr" data-tip="Сортировка лексикографическая: 1.10 встанет выше 1.9. Так и задумано — в соседних строках версии принадлежат разным компонентам, и сравнивать их по правилам rpm было бы не осмысленнее.">version-release <span class="arrow"></span></th>
        <th data-sort="tagged_in" data-tip="Koji-тег, в котором билд действительно затегован. Прочерк — билд затегован прямо в выбранный тег; имя — билд унаследован из этого тега. Вопросительный знак — снапшот собран версией, которая тег ещё не записывала.">тег <span class="arrow"></span></th>
        <th data-sort="branch" data-tip="Ветка GitLab, из которой собран билд. Если сборка шла с коммита, а не с ветки, рядом стоит тег from-commit.">ветка <span class="arrow"></span></th>
        <th data-sort="patches" data-tip="Сколько файлов лежит в каталоге PATCH ветки. Полоска показывает, из каких классов они состоят: цвет занимает долю, равную доле класса. Длина полоски одна у всех строк — сколько патчей, говорит число слева. Наведите на полоску, чтобы увидеть точные числа.">патчи <span class="arrow"></span></th>
        <th data-sort="rpms">RPM <span class="arrow"></span></th>
        <th data-sort="completed" data-tip="Когда koji завершил сборку, в московском времени. Хаб отдаёт UTC, в снапшоте хранится он же — перевод делается при построении дашборда. Сортировка показывает самые залежавшиеся.">собран <span class="arrow"></span></th>
        <th>теги</th>
        <th>ссылки</th>
      </tr></thead>
      <tbody id="state-rows"></tbody>
    </table></div>
  </section>
  <section id="tab-diff" hidden>
    <div class="selector" id="pair-select"></div>
    <div class="cards diff" id="diff-cards"></div>
    <div class="tablewrap"><table id="diff-table">
      <thead><tr>
        <th data-sort="name">компонент <span class="arrow">▲</span></th>
        <th data-sort="old" data-tip="Сортировка лексикографическая: 1.10 встанет выше 1.9. Так и задумано — в соседних строках версии принадлежат разным компонентам.">было <span class="arrow"></span></th>
        <th></th>
        <th data-sort="new" data-tip="Сортировка лексикографическая: 1.10 встанет выше 1.9. Так и задумано — в соседних строках версии принадлежат разным компонентам.">стало <span class="arrow"></span></th>
        <th data-sort="dpatch" data-tip="Сколько файлов патчей пришло и ушло. Сортировка — по сумме пришедших и ушедших: сверху компоненты, у которых стек патчей менялся сильнее всего.">Δ патчей <span class="arrow"></span></th>
        <th data-sort="drpm" data-tip="Сколько бинарных пакетов появилось и исчезло. Сортировка — по сумме появившихся и исчезнувших.">Δ RPM <span class="arrow"></span></th>
        <th>теги</th>
        <th>ссылки</th>
      </tr></thead>
      <tbody id="diff-rows"></tbody>
    </table></div>
  </section>
</div>
<div id="tip" role="tooltip"></div>
<!--__SCRIPTS__-->
</body>
</html>
