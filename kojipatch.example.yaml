koji:
  hub: https://kojihub.example.com/kojihub
  web: https://kojihub.example.com/koji

gitlab:
  default_host: gitlab.example.com
  token_env: GITLAB_TOKEN
  hosts:
    gitlab.example.com:
      api: https://gitlab.example.com/api/v4
      web: https://gitlab.example.com

patch_dir: PATCH

# Правила применяются по порядку, побеждает первое совпадение.
# Последнее всеохватное правило добавляется автоматически, если его нет.
patch_classes:
  - { name: CVE,  pattern: '(?i)CVE-\d{4}-\d{4,}' }
  # SAST и DAST — по вхождению в любом месте имени: маркер бывает и в начале
  # (SAST-src.core.ngx_file.c.patch.new), и в середине
  # (httpd-2.4.62-sast-src.core.c.patch.new).
  # Если понадобится строже — чтобы маркер не ловился внутри слова, — возьмите
  # '(?i)(?:^|[^a-z0-9])sast(?:[^a-z0-9]|$)'
  - { name: SAST, pattern: '(?i)sast' }
  - { name: DAST, pattern: '(?i)dast' }
  # Патч на спек: nginx.spec.patch, httpd-2.4.62.spec.patch.new. Точки в
  # шаблоне обязательны, иначе сюда уедут specialcase.patch и respec-fix.patch.
  # Правило стоит после CVE/SAST/DAST: спек-патч, закрывающий CVE, — прежде
  # всего CVE.
  - { name: SPEC, pattern: '(?i)\.spec\.' }
  # changelog.yaml — не исправление, а бухгалтерия каталога: своим классом он
  # перестаёт разбавлять other. Короткое написание .yml тоже ловится.
  - { name: CHANGELOG, pattern: '(?i)changelog\.ya?ml' }
